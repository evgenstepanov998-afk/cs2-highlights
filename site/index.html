<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хайлайты CS2</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e7e9ee;--muted:#8a91a0;
  --accent:#ff5500;--kill:#3ccf6e;--death:#ff4d5e;--cam:#f2b134;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
header nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
main{max-width:1400px;margin:0 auto;padding:20px 24px 60px}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{border-color:#3b4250}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit}
h2{font-size:16px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .map{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card .who{font-size:19px;font-weight:700;margin:4px 0}
.card .meta{font-size:13px;color:var(--muted)}
.kd b.k{color:var(--kill)} .kd b.d{color:var(--death)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel2);cursor:pointer;border:1px solid transparent}
.row:hover{border-color:var(--line)}
.row.sel{border-color:var(--accent)}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted);font-size:13px}
.team2{border-left:3px solid #d8a13a}.team3{border-left:3px solid #5b8fd8}
.log{font:12px/1.5 Consolas,monospace;background:var(--bg);border-radius:8px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:10px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.player{background:#000;border-radius:12px;overflow:hidden;position:relative}
.player video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.badge{position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:6px;font-weight:700;font-size:14px;background:rgba(0,0,0,.65);pointer-events:none}
.badge.kill{color:var(--kill)}.badge.death{color:var(--death)}.badge.cam{color:#111;background:var(--cam)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.controls .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.controls .seg button{border:0;border-radius:0}
.controls .seg button.on{background:var(--accent);color:#fff}
.timeline{display:flex;gap:3px;align-items:flex-end;margin:6px 0 18px;overflow-x:auto;padding-bottom:4px}
.rnd{flex:1 0 26px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border-radius:6px}
.rnd:hover{background:var(--panel2)}
.rnd.cur{background:var(--panel2);outline:1px solid var(--accent)}
.rnd .n{font-size:11px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%}
.dot.kill{background:var(--kill)}.dot.death{background:var(--death)}
.rnd .empty{width:12px;height:12px;border-radius:50%;border:1px dashed var(--line)}
.clips{max-height:calc(100vh - 160px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.rgroup h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.clip{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;margin-bottom:5px}
.clip:hover{border-color:#3b4250}
.clip.cur{border-color:var(--accent)}
.clip .ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.clip.kill .ic{background:rgba(60,207,110,.15);color:var(--kill)}
.clip.death .ic{background:rgba(255,77,94,.15);color:var(--death)}
.clip .t{font-weight:600;font-size:14px}
.clip .s{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--muted);margin-left:4px}
.empty-state{color:var(--muted);padding:30px;text-align:center}
.hero{max-width:760px;margin:30px auto}
.hero p,.hero li{line-height:1.6}
.hero ol,.hero ul{padding-left:22px}
.hero li{margin:8px 0}
.hero code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:13px;word-break:break-all}
@media (max-width:900px){.cols,.viewer{grid-template-columns:1fr}.clips{max-height:none}main{padding:16px}}
</style>
</head>
<body>
<header>
  <h1><span>▶</span> Хайлайты CS2</h1>
  <nav><a class="btn" href="#/">Библиотека</a><button id="quit" hidden title="Полностью выключить программу на этом компьютере">⏻ Выключить программу</button></nav>
</header>
<main id="app"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// On GitHub Pages the page talks to the helper program on this PC; locally it is the same origin.
const API = location.protocol === "https:" ? "http://127.0.0.1:8765" : "";
const RELEASES = "https://github.com/evgenstepanov998-afk/cs2-highlights/releases/latest";
const lib = p => `${API}/library/${p}`;
const api = async (url, body) => {
  const r = await fetch(API + url, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const W = w => (w || "").replace(/^weapon_/, "").replace("usp_silencer", "USP-S").replace("m4a1_silencer", "M4A1-S").toUpperCase();
const mapName = m => (m || "").replace(/^de_/, "").replace(/^\w/, c => c.toUpperCase());
// "2026-11-04 10:38" -> "04.11.2026, 10:38"
const niceDate = s => { const m = (s || "").match(/^(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d)/); return m ? `${m[3]}.${m[2]}.${m[1]}, ${m[4]}` : s; };

let pollTimer = null, bootTimer = null, ready = false;
window.addEventListener("hashchange", () => ready && route());
boot();
// keeps the helper alive while this tab is open; it quits ~2 min after the tab is closed
setInterval(() => { if (ready) fetch(API + "/api/ping").catch(() => { ready = false; boot(); }); }, 20000);

$("#quit").onclick = async () => {
  const j = await api("/api/job").catch(() => ({}));
  if (!confirm(j.running ? "Идёт запись. Остановить её и выключить программу? Готовые клипы сохранятся."
                         : "Выключить программу CS2 Highlights на этом компьютере?")) return;
  await api("/api/quit", {}).catch(() => {});
  ready = false;
  setTimeout(boot, 1500);
};

function route() {
  $("#quit").hidden = false;
  const m = location.hash.match(/^#\/d\/(.+)$/);
  if (m) showDemo(decodeURIComponent(m[1])); else showHome();
}

/* ---------- program not running / first-run setup ---------- */
async function boot() {
  clearTimeout(bootTimer);
  let st;
  try { await api("/api/ping"); st = await api("/api/setup"); }
  catch { showOffline(); bootTimer = setTimeout(boot, 3000); return; }
  if (!st.ready) {
    // terms were accepted earlier but tools are gone (deleted, other PC user…) — just install again
    if (st.accepted && !st.running && !st.error) { try { st = await api("/api/setup/accept", {}); } catch { } }
    showSetup(st);
    if (st.running || st.accepted) bootTimer = setTimeout(boot, 1000);
    return;
  }
  ready = true;
  route();
}

function showOffline() {
  $("#quit").hidden = true;
  $("#app").innerHTML = `
    <section class="panel hero">
      <h2>Программа не запущена</h2>
      <p>Хайлайты записывает небольшая программа на твоём компьютере — сайт только управляет ей.</p>
      <ol>
        <li><a class="btn primary" href="${RELEASES}" target="_blank" rel="noopener">Скачать CS2Highlights.exe</a></li>
        <li>Запусти её. Если Windows покажет «Система Windows защитила ваш компьютер» — нажми «Подробнее» → «Выполнить в любом случае».</li>
        <li>Если браузер спросит про доступ к устройствам в локальной сети — разреши: так сайт видит программу.</li>
      </ol>
      <p class="muted">Эта страница сама продолжит, как только программа запустится.</p>
    </section>`;
}

function showSetup(st) {
  if (st.running || (st.accepted && !st.error)) {
    $("#app").innerHTML = `
      <section class="panel hero">
        <h2>Устанавливаю инструменты</h2>
        <p>${esc(st.step || "Начинаю…")}</p>
        <div class="bar"><i style="width:${Math.round((st.progress || 0) * 100)}%"></i></div>
        <p class="muted">Это нужно один раз. ~130 МБ.</p>
      </section>`;
    return;
  }
  $("#app").innerHTML = `
    <section class="panel hero">
      <h2>Перед началом</h2>
      ${st.error ? `<p style="color:var(--death)">${esc(st.error)}</p>` : ""}
      ${st.cs2_found ? "" : `<p style="color:var(--death)">Не нашёл CS2 в библиотеках Steam. Установи игру и перезапусти программу.</p>`}
      <p>Чтобы записывать хайлайты, программа:</p>
      <ul>
        <li>скачает <b>HLAE</b> (открытый инструмент записи демок, advancedfx.org) и <b>ffmpeg</b> (~130 МБ) в папку программы;</li>
        <li>на время записи запустит CS2 <b>в фоне</b> через HLAE в режиме <b>без VAC</b> (<code>-insecure</code>) — только для проигрывания демки, на сервера из неё не заходит;</li>
        <li>на время записи поставит в CS2 <b>минимальную графику</b> и вернёт твои настройки сразу после;</li>
        <li>спрячет окно CS2 и выключит её звук в микшере Windows, а в конце покажет уведомление;</li>
        <li>сохранит клипы в <code>${esc(st.data_dir)}</code>. Ничего никуда не загружается;</li>
        <li>сама выключится через 2 минуты после того, как закроешь этот сайт. В автозагрузку не ставится.</li>
      </ul>
      <p><b>Пока идёт запись — не запускай CS2 и не закрывай Steam.</b></p>
      <label style="display:flex;gap:8px;align-items:center;margin:14px 0"><input type="checkbox" id="agree"> Понимаю и согласен</label>
      <button class="primary" id="accept" disabled>Установить и начать</button>
    </section>`;
  $("#agree").onchange = e => $("#accept").disabled = !e.target.checked || !st.cs2_found;
  $("#accept").onclick = async () => { await api("/api/setup/accept", {}); boot(); };
}

/* ---------- library + new recording ---------- */
async function showHome() {
  const app = $("#app");
  app.innerHTML = `
    <div class="cols">
      <section class="panel">
        <h2>1. Демка</h2>
        <input type="text" id="path" placeholder="Путь к .dem или .dem.gz (можно вставить из проводника)">
        <div style="margin:10px 0 6px" class="muted">Найдено в replays и Загрузках:</div>
        <div class="list" id="demos"><div class="muted">Ищу…</div></div>
        <div style="margin-top:12px"><button id="analyze">Открыть демку</button></div>
      </section>
      <section class="panel">
        <h2>2. Игрок</h2>
        <div id="players" class="list"><div class="muted">Сначала выбери демку.</div></div>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
          <button class="primary" id="record" disabled>Записать хайлайты</button>
          <span class="muted" id="est"></span>
        </div>
        <div id="job"></div>
      </section>
    </div>
    <h2>Записанные демки</h2>
    <div class="grid" id="lib"></div>`;

  let chosen = null, demoPath = null;
  $("#analyze").onclick = analyze;
  $("#record").onclick = async () => {
    try { await api("/api/record", {path: demoPath, steamid: chosen}); pollJob(); }
    catch (e) { alert(e.message); }
  };

  api("/api/demos").then(list => {
    $("#demos").innerHTML = list.length ? list.map(d => `
      <div class="row" data-p="${esc(d.path)}" title="${esc(d.name)}">
        <span class="grow"><b>${esc(niceDate(d.modified))}</b> · ${esc(d.map ? mapName(d.map) : "карта ?")}</span>
        <span class="muted">${d.size_mb} МБ</span>
      </div>`).join("")
      : `<div class="muted">Ничего не нашёл — вставь путь вручную.</div>`;
    $("#demos").querySelectorAll(".row").forEach(r => r.onclick = () => { $("#path").value = r.dataset.p; analyze(); });
  });

  async function analyze() {
    const p = $("#path").value.trim().replace(/^"|"$/g, "");
    if (!p) return;
    $("#players").innerHTML = `<div class="muted">Читаю демку…</div>`;
    try {
      const info = await api("/api/analyze", {path: p});
      demoPath = info.path;
      $("#players").innerHTML = `<div class="muted">${esc(mapName(info.map))}, ${info.rounds} раундов</div>` + info.players.map(pl => `
        <div class="row team${pl.team}" data-s="${pl.steamid}" data-v="${pl.video_seconds}">
          <span class="grow"><b>${esc(pl.name)}</b></span>
          <span class="kd"><b class="k">${pl.kills}</b> / <b class="d">${pl.deaths}</b></span>
        </div>`).join("");
      $("#players").querySelectorAll(".row[data-s]").forEach(r => r.onclick = () => {
        $("#players").querySelectorAll(".row").forEach(x => x.classList.remove("sel"));
        r.classList.add("sel"); chosen = r.dataset.s;
        $("#record").disabled = false;
        $("#est").textContent = `≈ ${Math.round(r.dataset.v / 60 * 10) / 10} мин видео`;
      });
    } catch (e) { $("#players").innerHTML = `<div class="muted">Ошибка: ${esc(e.message)}</div>`; }
  }

  try {
    const items = await (await fetch(lib("index.json"), {cache: "no-store"})).json();
    $("#lib").innerHTML = items.map(d => `
      <div class="card" onclick="location.hash='#/d/${encodeURIComponent(d.key)}'">
        <div class="map">${esc(mapName(d.map))} · ${esc(d.recorded)}</div>
        <div class="who">${esc(d.player.name)}</div>
        <div class="meta kd"><b class="k">${d.player.kills}</b> убийств · <b class="d">${d.player.deaths}</b> смертей · ${d.clips} клипов</div>
        ${d.status === "recording" ? `<div class="meta" style="color:var(--accent)">● идёт запись — можно смотреть готовые</div>` : ""}
        <div class="meta">${esc(d.demo)}</div>
      </div>`).join("");
  } catch { $("#lib").innerHTML = `<div class="empty-state">Пока пусто — запиши первую демку.</div>`; }

  pollJob();
}

async function pollJob() {
  clearTimeout(pollTimer);
  const box = $("#job");
  if (!box) return;
  const j = await api("/api/job");
  if (!j.log.length && !j.running) return;
  const pct = j.total ? Math.round(j.done / j.total * 100) : 0;
  box.innerHTML = `<div class="bar"><i style="width:${j.running ? pct : 100}%"></i></div>
    <div class="muted" style="margin-top:6px">${j.running ? `Записываю: ${j.done} / ${j.total || "…"}` : j.error ? "Остановлено с ошибкой" : "Готово"}</div>
    <div class="log">${esc(j.log.join("\n"))}</div>
    ${j.result ? `<div style="margin-top:10px"><a class="btn" href="#/d/${encodeURIComponent(j.result)}">Смотреть клипы →</a></div>` : ""}`;
  const log = box.querySelector(".log"); log.scrollTop = log.scrollHeight;
  $("#record").disabled = j.running;
  if (j.running) pollTimer = setTimeout(pollJob, 1000);
}

/* ---------- demo viewer ---------- */
async function showDemo(key) {
  clearTimeout(pollTimer);
  const app = $("#app");
  let meta;
  try { meta = await (await fetch(lib(`${key}/meta.json`), {cache: "no-store"})).json(); }
  catch { app.innerHTML = `<div class="empty-state">Не нашёл эту запись.</div>`; return; }

  const me = meta.player;
  let clips = meta.clips.filter(c => c.file);
  let filter = "all", cur = null, stopAt = null, autoplay = true;

  app.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px">
      <div style="font-size:22px;font-weight:700">${esc(me.name)}</div>
      <div class="muted">${esc(mapName(meta.map))} · ${meta.rounds.length} раундов · ${esc(meta.recorded)} · <span id="status"></span></div>
      <div class="kd" style="margin-left:auto"><b class="k">${me.kills}</b> / <b class="d">${me.deaths}</b></div>
    </div>
    <div class="timeline" id="tl"></div>
    <div class="viewer">
      <div>
        <div class="player"><video id="v" controls playsinline></video><div class="badge" id="badge" hidden></div></div>
        <div class="controls">
          <div class="seg" id="flt">
            <button data-f="all" class="on">Всё</button><button data-f="kill">Убийства</button><button data-f="death">Смерти</button>
          </div>
          <button id="prev">⏮ Пред.</button><button id="next">След. ⏭</button>
          <a class="btn" id="dl" href="#">⬇ Скачать клип</a>
          <button id="folder" title="Открыть папку с клипами в проводнике">📁 Папка</button>
          <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="auto" checked> подряд</label>
          <span class="muted" id="info" style="margin-left:auto"></span>
        </div>
      </div>
      <div class="clips" id="clips"></div>
    </div>`;

  const v = $("#v"), badge = $("#badge");
  const visible = () => clips.filter(c => filter === "all" ? !c.inside_death : c.kind === filter);

  function title(c) {
    const e = c.events;
    if (c.kind === "kill") {
      const n = e.length;
      return (n > 1 ? `${n}K: ` : "") + e.map(x => esc(x.victim_name)).join(", ");
    }
    return `убил ${esc(e[0].attacker_name || "мир")}`;
  }
  function sub(c) {
    return c.events.map(x => W(x.weapon) + (x.headshot ? " · HS" : "") + (x.wallbang ? " · прострел" : "") + (x.thrusmoke ? " · через смок" : "") + (x.noscope ? " · noscope" : "")).join(" | ")
      + (c.kind === "death" && c.segments.length > 1 ? `<span class="tag">+ взгляд убийцы</span>` : "");
  }

  function renderTimeline() {
    $("#tl").innerHTML = meta.rounds.map(r => {
      const rc = clips.filter(c => c.round === r.number);
      const dots = rc.filter(c => c.kind === "kill").flatMap(c => c.events).map(() => `<span class="dot kill"></span>`).join("")
        + rc.filter(c => c.kind === "death").map(() => `<span class="dot death"></span>`).join("");
      return `<div class="rnd ${cur && cur.round === r.number ? "cur" : ""}" data-r="${r.number}" title="Раунд ${r.number}">${dots || `<span class="empty"></span>`}<span class="n">${r.number}</span></div>`;
    }).join("");
    $("#tl").querySelectorAll(".rnd").forEach(el => el.onclick = () => {
      const c = visible().find(c => c.round === +el.dataset.r) || clips.find(c => c.round === +el.dataset.r);
      if (c) play(c);
    });
  }

  function renderList() {
    const list = visible();
    const rounds = [...new Set(list.map(c => c.round))];
    $("#clips").innerHTML = rounds.length ? rounds.map(r => `
      <div class="rgroup"><h3>Раунд ${r}</h3>${list.filter(c => c.round === r).map(c => `
        <div class="clip ${c.kind} ${cur === c ? "cur" : ""}" data-id="${c.id}">
          <div class="ic">${c.kind === "kill" ? (c.events.length > 1 ? c.events.length + "K" : "K") : "✕"}</div>
          <div style="min-width:0"><div class="t">${title(c)}</div><div class="s">${sub(c)}</div></div>
        </div>`).join("")}</div>`).join("")
      : `<div class="empty-state">Нет клипов</div>`;
    $("#clips").querySelectorAll(".clip").forEach(el => el.onclick = () => play(clips.find(c => c.id === el.dataset.id)));
    const curEl = $("#clips .clip.cur");
    if (curEl) curEl.scrollIntoView({block: "nearest"});
  }

  function play(c) {
    cur = c;
    const src = lib(`${key}/${c.file}`);
    const start = c.offset || 0;
    stopAt = c.inside_death ? start + 4 : null;
    $("#dl").href = src + "?download=1";
    if (!v.src.endsWith(src)) { v.src = src; v.addEventListener("loadedmetadata", () => { v.currentTime = start; v.play(); }, {once: true}); }
    else { v.currentTime = start; v.play(); }
    $("#info").textContent = `Раунд ${c.round}`;
    renderTimeline(); renderList();
  }

  function step(d) {
    const list = visible();
    const i = list.indexOf(cur);
    const n = list[i + d];
    if (n) play(n);
  }

  v.addEventListener("timeupdate", () => {
    if (!cur) return;
    if (stopAt && v.currentTime >= stopAt) { stopAt = null; v.pause(); if (autoplay) step(1); return; }
    const offs = cur.part_offsets || [0];
    if (cur.kind === "death" && !cur.inside_death && offs.length > 1 && v.currentTime >= offs[1]) {
      badge.hidden = false; badge.className = "badge cam"; badge.textContent = `Взгляд убийцы: ${cur.segments[1].pov_name}`;
    } else {
      badge.hidden = false; badge.className = `badge ${cur.kind}`;
      badge.textContent = cur.kind === "kill" ? `Раунд ${cur.round} · убийство` : `Раунд ${cur.round} · смерть`;
    }
  });
  v.addEventListener("ended", () => { if (autoplay) step(1); });
  $("#folder").onclick = () => api("/api/open-folder", {key}).catch(e => alert(e.message));
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
  $("#auto").onchange = e => autoplay = e.target.checked;
  $("#flt").querySelectorAll("button").forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    $("#flt").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    renderList();
    const first = visible()[0]; if (first) play(first);
  });

  function renderStatus() {
    const all = meta.clips.filter(c => !c.inside_death).length;
    const ready = meta.clips.filter(c => c.file && !c.inside_death).length;
    $("#status").textContent = meta.status === "recording"
      ? `идёт запись: готово ${ready} из ${all} клипов…`
      : `записано за ${Math.round(meta.took_seconds / 6) / 10} мин`;
  }

  // While recording, new clips appear every few seconds — merge them in without touching playback.
  async function refresh() {
    if (location.hash !== `#/d/${encodeURIComponent(key)}` && location.hash !== `#/d/${key}`) return;
    try { meta = await (await fetch(lib(`${key}/meta.json`), {cache: "no-store"})).json(); } catch { }
    const curId = cur && cur.id;
    clips = meta.clips.filter(c => c.file);
    cur = clips.find(c => c.id === curId) || cur;
    renderStatus(); renderTimeline(); renderList();
    if (!cur && visible()[0]) { cur = visible()[0]; v.src = lib(`${key}/${cur.file}`); $("#dl").href = v.src + "?download=1"; renderList(); }
    if (meta.status === "recording") pollTimer = setTimeout(refresh, 3000);
  }

  renderStatus(); renderTimeline(); renderList();
  if (visible()[0]) { cur = visible()[0]; v.src = lib(`${key}/${cur.file}`); $("#dl").href = v.src + "?download=1"; renderList(); renderTimeline(); }
  if (meta.status === "recording") pollTimer = setTimeout(refresh, 3000);
}
</script>
</body>
</html>
